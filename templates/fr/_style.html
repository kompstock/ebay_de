<style>
.kpx{max-width:940px;margin:0 auto;background:#fff;color:#14161a;
 font-family:'Market Sans',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:17px;line-height:1.6;
 border:1px solid #e4e4e1;border-radius:14px;overflow:hidden}
.kpx *{box-sizing:border-box}
.kpx img{max-width:100%;height:auto;display:block}

/* --- 1. naglowek --- */
.kpx-hd{padding:26px 32px 24px;background:#14161a;color:#fff}
.kpx-hd-brand{margin-bottom:16px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#aeb0b4}
.kpx-hd-brand b{display:inline-block;margin-right:10px;padding-left:10px;font-size:16px;letter-spacing:.22em;
 color:#fff;border-left:4px solid #e2231a}
.kpx-hd h1{margin:0 0 8px;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:-.01em;color:#fff}
.kpx-hd-sub{margin:0 0 18px;font-size:16px;color:#c9cacd}
.kpx-pills{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.kpx-pills li{border:1px solid #43464d;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:#fff}
.kpx-pills li:before{content:"\2713";color:#6fdc9d;font-weight:800;margin-right:7px}

/* --- 2. hero: zdjecie + kluczowe parametry --- */
.kpx-hero{display:flex;flex-wrap:wrap;border-bottom:1px solid #ededea}
.kpx-hero-fig{flex:1 1 400px;min-width:0;padding:28px 32px;background:#fff;
 border-right:1px solid #ededea;display:flex;align-items:center;justify-content:center}
.kpx-hero-fig img{width:100%;max-width:440px;margin:0 auto}
.kpx-hero-specs{flex:1 1 320px;min-width:0;padding:26px 32px}
.kpx-eyebrow{margin:0 0 14px;font-size:14px;font-weight:800;letter-spacing:.16em;
 text-transform:uppercase;color:#5a5c62}
.kpx-spec{display:flex;justify-content:space-between;align-items:baseline;gap:18px;
 padding:11px 0;border-bottom:1px solid #ededea}
.kpx-spec:last-child{border-bottom:0;padding-bottom:0}
.kpx-spec i{font-style:normal;font-size:15px;color:#5a5c62;white-space:nowrap}
.kpx-spec b{font-size:16px;font-weight:700;text-align:right}

/* --- 3. pasek zaufania --- */
.kpx-trust{display:flex;flex-wrap:wrap;border-bottom:1px solid #ededea}
.kpx-trust > div{flex:1 1 210px;min-width:0;padding:20px 24px;border-right:1px solid #ededea}
.kpx-trust > div:last-child{border-right:0}
.kpx-trust b{display:block;font-size:16px;margin-bottom:3px}
.kpx-trust b:before{content:"\2713";color:#0f7a41;font-weight:800;margin-right:7px}
.kpx-trust span{display:block;font-size:15px;line-height:1.5;color:#5a5c62}

/* --- sekcje --- */
.kpx-sec{padding:30px 32px}
.kpx-sec + .kpx-sec{border-top:1px solid #ededea}
.kpx-h2{position:relative;margin:0 0 20px;padding:0 0 12px;border-bottom:1px solid #ededea;
 font-size:21px;font-weight:700;letter-spacing:-.01em}
.kpx-h2:after{content:"";position:absolute;left:0;bottom:-1px;width:46px;height:3px;background:#e2231a}
.kpx-h2 i{font-style:normal;margin-right:10px;font-size:14px;font-weight:800;letter-spacing:.08em;color:#e2231a}
.kpx-sec p{margin:0 0 14px;max-width:72ch}
.kpx-sec p:last-child{margin-bottom:0}
.kpx-lead{color:#3d3f45}

/* karty wartosci */
.kpx-cards{display:flex;flex-wrap:wrap;gap:14px}
.kpx-card{flex:1 1 240px;min-width:0;padding:18px 20px;background:#faf9f7;
 border:1px solid #e0e0dd;border-radius:12px}
.kpx-card b{display:block;font-size:17px;margin-bottom:6px}
.kpx-card span{display:block;font-size:16px;line-height:1.55;color:#5a5c62}

/* odznaka + tabele */
.kpx-badge{display:inline-block;margin-bottom:16px;padding:6px 14px;font-size:15px;font-weight:700;
 color:#0f6b3c;background:#eef7f1;border:1px solid #cde6d8;border-radius:999px}
.kpx-badge:before{content:"\2713";margin-right:7px}
.kpx-table{width:calc(100% + 28px);margin-left:-14px;border-collapse:collapse;font-size:16px}
.kpx-table th,.kpx-table td{padding:11px 14px;text-align:left;vertical-align:top}
.kpx-table tr:nth-child(odd){background:#f6f6f4}
.kpx-table th{width:28%;font-weight:400;color:#5a5c62;white-space:nowrap}

/* zielone pudelko */
.kpx-box{margin-top:18px;padding:16px 20px;background:#eef7f1;border:1px solid #cde6d8;border-radius:12px}
.kpx-box b{display:block;margin-bottom:4px;color:#0f6b3c}
.kpx-box span{font-size:16px;color:#2f4a3c}

/* zlacza */
.kpx-ports{display:flex;flex-wrap:wrap;gap:9px;margin:0;padding:0;list-style:none}
.kpx-ports li{padding:8px 16px;font-size:16px;font-weight:700;color:#3d3f45;
 border:1px solid #e0e0dd;border-radius:999px}

/* 6 krokow */
.kpx-steps{display:flex;flex-wrap:wrap;gap:14px;margin:0;padding:0;list-style:none;counter-reset:s}
.kpx-steps li{counter-increment:s;flex:1 1 270px;min-width:0;display:flex;gap:14px;
 padding:16px 18px;border:1px solid #e0e0dd;border-radius:12px}
.kpx-steps li:before{content:"0" counter(s);flex:0 0 36px;height:36px;line-height:36px;
 background:#14161a;color:#fff;border-radius:50%;font-size:14px;font-weight:800;
 letter-spacing:.04em;text-align:center}
.kpx-steps div{min-width:0}
.kpx-steps b{display:block;font-size:16px;margin-bottom:2px}
.kpx-steps span{display:block;font-size:15px;line-height:1.5;color:#5a5c62}

/* FAQ */
.kpx-faq details{margin-bottom:9px;border:1px solid #e0e0dd;border-radius:10px}
.kpx-faq details:last-child{margin-bottom:0}
.kpx-faq summary{padding:15px 18px;font-size:17px;font-weight:700;cursor:pointer;list-style:none}
.kpx-faq summary::-webkit-details-marker{display:none}
.kpx-faq summary:after{content:"+";float:right;margin-left:12px;color:#e2231a;font-size:22px;font-weight:800;line-height:1.2}
.kpx-faq details[open] summary:after{content:"\2013"}
.kpx-faq .kpx-a{padding:0 18px 17px;max-width:66ch;font-size:17px;color:#3d3f45}

/* o nas */
.kpx-row{display:flex;flex-wrap:wrap;gap:28px;align-items:center;margin-bottom:24px}
.kpx-row:last-child{margin-bottom:0}
.kpx-row > div{flex:1 1 290px;min-width:0}
.kpx-row p{margin:0}
.kpx-row img{width:100%;border-radius:12px}

/* stopka CTA */
.kpx-cta{padding:28px 32px;background:#14161a;color:#fff;text-align:center}
.kpx-cta b{display:block;margin-bottom:8px;font-size:22px;color:#fff}
.kpx-cta p{margin:0 auto 16px;max-width:60ch;font-size:16px;color:#c9cacd}
.kpx-cta ul{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0;padding:0;list-style:none}
.kpx-cta li{padding:7px 14px;font-size:14px;font-weight:700;border:1px solid #43464d;border-radius:999px}

/* Na telefonie tekst zostaje tej samej wielkosci co na komputerze - tylko
   tytul sie zmniejsza, bo dlugie nazwy modeli lamalyby sie na pol ekranu.
   Wczesniej arkusz zmniejszal tu tabelke i zlacza, czyli dokladnie to,
   co kupujacy czyta najuwazniej, i to na urzadzeniu, na ktorym czyta najczesciej. */
@media (max-width:620px){
 .kpx-hd{padding:22px 18px}
 .kpx-hd h1{font-size:23px}
 .kpx-hero-fig,.kpx-hero-specs{flex-basis:100%;padding:20px 18px;border-right:0}
 .kpx-hero-fig{border-bottom:1px solid #ededea}
 .kpx-trust > div{flex-basis:100%;border-right:0;border-bottom:1px solid #ededea;padding:16px 18px}
 .kpx-trust > div:last-child{border-bottom:0}
 .kpx-sec{padding:24px 18px}
 .kpx-h2{font-size:20px}
 .kpx-table{width:calc(100% + 20px);margin-left:-10px;font-size:16px}
 .kpx-table th{width:42%;white-space:normal}
 .kpx-table th,.kpx-table td{padding:11px 10px}
 .kpx-spec{flex-wrap:wrap;gap:2px}
 .kpx-spec b{text-align:left}
 .kpx-ports li{padding:9px 15px;font-size:16px}
 .kpx-cta{padding:24px 18px}
}

/* Zdjecie produktu wstawia generator w bloku .kpx-media. */
.kpx-media{width:100%}
.kpx-media img{width:100%;max-width:440px;margin:0 auto}
</style>
