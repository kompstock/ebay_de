name: Generuj CSV eBay DE

on:
  workflow_dispatch:
    inputs:
      tryb:
        description: "Co zrobić"
        type: choice
        default: nowe
        options:
          - pierwsze
          - nowe
          - aktualizacja
          - test
      ignoruj_prog:
        description: "Publikuj mimo przekroczonych progów"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uruchom testy
        run: python -m unittest discover -s tests -v

      - name: Dopisz kategorie 179 (komputery) do ebay-vocab.json
        run: python3 tools/dodaj_kategorie_179.py

      - name: Wygeneruj pliki
        continue-on-error: true
        run: python src/generate.py --tryb "${{ inputs.tryb }}"

      - name: Podsumowanie
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("output/generation-report.json")
          if not p.exists():
              print("## Generowanie nie doszlo do skutku"); raise SystemExit
          r = json.loads(p.read_text(encoding="utf-8"))
          print(f"## Tryb: {r['tryb']}\n")
          if not r["ok"]:
              print("### PRZEBIEG ZATRZYMANY\n")
              for b in r["blokady"]:
                  print(f"- {b}")
              print()
          print("| | |\n|---|---|")
          print(f"| Produktow w kategorii | {r['produktow_w_kategorii']} |")
          print(f"| Z zapasem | {r['produktow_z_zapasem']} |")
          print(f"| Aktywnych na eBay | {r['aktywnych_na_ebay']} |")
          print(f"| **Do wystawienia** | **{r['do_wystawienia']}** |")
          print(f"| **Do aktualizacji** | **{r['do_aktualizacji']}** (zerowanych: {r['w_tym_zerowanych']}) |")
          print(f"| Kurs NBP | {r['nbp']['rate']} z {r['nbp']['effective_date']} |")
          if r["sku_zdublowane"]:
              print(f"\n### SKU z kilkoma aukcjami (pominiete)\n")
              for s in r["sku_zdublowane"][:20]:
                  print(f"- `{s}`")
          print(f"\n### Powody pominiecia\n")
          for k, v in sorted(r["pominieto"].items(), key=lambda i: -i[1]):
              print(f"- `{k}` — {v}")
          for tytul, klucz in [("Marki bez GPSR", "marki_bez_gpsr"),
                               ("Brakujace tlumaczenia", "brakujace_tlumaczenia"),
                               ("Wartosci aspektow", "wartosci_aspektow"),
                               ("Etykiety portow", "etykiety_portow"),
                               ("Klawiatury", "klawiatury")]:
              items = r.get("do_uzupelnienia", {}).get(klucz, [])
              if items:
                  print(f"\n### {tytul}\n")
                  for i in items[:15]:
                      print(f"- **{i['produktow']}x** — {i['wartosc'][:150]}")
          PY

      - name: Zapisz artefakty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wynik-generowania
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Bramka
        run: |
          python - <<'PY'
          import json, os, sys
          r = json.load(open("output/generation-report.json", encoding="utf-8"))
          if os.environ.get("IGNORUJ") == "true":
              print("progi pominiete na zyczenie"); raise SystemExit
          if not r["ok"]:
              sys.exit("BLOKADA: " + " | ".join(r["blokady"]))
          if r["tryb"] != "aktualizacja" and r["do_wystawienia"] == 0:
              print("brak nowych produktow - to nie blad")
          PY
        env:
          IGNORUJ: ${{ inputs.ignoruj_prog }}

      - name: Przygotuj stronę
        if: always()
        run: |
          mkdir -p site/downloads
          cp output/* site/downloads/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

      - name: Opublikuj stronę
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4
