name: Generuj CSV eBay

on:
  workflow_dispatch:
    inputs:
      kraj:
        description: "Rynek docelowy"
        type: choice
        default: de
        options:
          - de
          - it
      tryb:
        description: "Co zrobić"
        type: choice
        default: nowe
        options:
          - pierwsze
          - nowe
          - aktualizacja
          - test
      ignoruj_prog:
        description: "Publikuj mimo przekroczonych progów"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uruchom testy
        run: python -m unittest discover -s tests -v

      # Kategoria 179 (komputery) siedzi na stale w config/ebay-vocab.json.
      # Nie dopisujemy jej w kazdym przebiegu: gdy jej brakuje, generate.py
      # przerywa z komunikatem, zamiast po cichu gubic wszystkie komputery.
      # Do odtworzenia wpisu sluzy tools/dodaj_kategorie_179.py.

      # Jeden przebieg = jeden kraj. Rynki nie moga sobie nawzajem wyzerowac
      # aukcji, bo raport aktywnych ofert filtruje sie po 'Listing site'.
      - name: Wygeneruj pliki
        continue-on-error: true
        run: python src/generate.py --kraj "${{ inputs.kraj }}" --tryb "${{ inputs.tryb }}"

      - name: Podsumowanie
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          p = pathlib.Path(f"output/{os.environ['KRAJ']}/generation-report.json")
          if not p.exists():
              print("## Generowanie nie doszlo do skutku"); raise SystemExit
          r = json.loads(p.read_text(encoding="utf-8"))
          print(f"## Tryb: {r['tryb']}\n")
          if not r["ok"]:
              print("### PRZEBIEG ZATRZYMANY\n")
              for b in r["blokady"]:
                  print(f"- {b}")
              print()
          print("| | |\n|---|---|")
          print(f"| Produktow w kategorii | {r['produktow_w_kategorii']} |")
          print(f"| Z zapasem | {r['produktow_z_zapasem']} |")
          for typ, ile in r.get("produktow_z_zapasem_wg_typu", {}).items():
              print(f"| &nbsp;&nbsp;{typ} | {ile} |")
          print(f"| Aktywnych na eBay | {r['aktywnych_na_ebay']} |")
          print(f"| **Do wystawienia** | **{r['do_wystawienia']}** |")
          for kat, ile in r.get("do_wystawienia_wg_kategorii", {}).items():
              print(f"| &nbsp;&nbsp;{kat} | {ile} |")
          print(f"| **Do aktualizacji** | **{r['do_aktualizacji']}** (zerowanych: {r['w_tym_zerowanych']}) |")
          if r.get("stany_ograniczone"):
              print(f"| &nbsp;&nbsp;{r['stany_ograniczone']['plik']} | "
                    f"{r['do_aktualizacji_ograniczone']} "
                    f"({r['stany_ograniczone']['opis']}) |")
          print(f"| Kurs NBP | {r['nbp']['rate']} z {r['nbp']['effective_date']} |")
          if r["sku_zdublowane"]:
              print(f"\n### SKU z kilkoma aukcjami (pominiete)\n")
              for s in r["sku_zdublowane"][:20]:
                  print(f"- `{s}`")
          print(f"\n### Powody pominiecia\n")
          for k, v in sorted(r["pominieto"].items(), key=lambda i: -i[1]):
              print(f"- `{k}` — {v}")
          for tytul, klucz in [("Marki bez GPSR", "marki_bez_gpsr"),
                               ("Brakujace tlumaczenia", "brakujace_tlumaczenia"),
                               ("Wartosci aspektow", "wartosci_aspektow"),
                               ("Etykiety portow", "etykiety_portow"),
                               ("Klawiatury", "klawiatury")]:
              items = r.get("do_uzupelnienia", {}).get(klucz, [])
              if items:
                  print(f"\n### {tytul}\n")
                  for i in items[:15]:
                      print(f"- **{i['produktow']}x** — {i['wartosc'][:150]}")
          PY
        env:
          KRAJ: ${{ inputs.kraj }}

      - name: Zapisz artefakty
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wynik-generowania-${{ inputs.kraj }}
          path: output/${{ inputs.kraj }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Bramka
        run: |
          python - <<'PY'
          import json, os, sys
          r = json.load(open(f"output/{os.environ['KRAJ']}/generation-report.json", encoding="utf-8"))
          if os.environ.get("IGNORUJ") == "true":
              print("progi pominiete na zyczenie"); raise SystemExit
          if not r["ok"]:
              sys.exit("BLOKADA: " + " | ".join(r["blokady"]))
          if r["tryb"] != "aktualizacja" and r["do_wystawienia"] == 0:
              print("brak nowych produktow - to nie blad")
          PY
        env:
          IGNORUJ: ${{ inputs.ignoruj_prog }}
          KRAJ: ${{ inputs.kraj }}

      - name: Przygotuj stronę
        if: always()
        run: |
          # Dwa miejsca naraz: plasko, bo strona czyta downloads/ i ma pokazywac
          # ostatni przebieg niezaleznie od rynku, oraz w katalogu kraju, zeby
          # wynik DE nie przykrywal wloskiego w archiwum.
          mkdir -p site/downloads "site/downloads/${{ inputs.kraj }}"
          cp output/${{ inputs.kraj }}/* site/downloads/ 2>/dev/null || true
          cp output/${{ inputs.kraj }}/* "site/downloads/${{ inputs.kraj }}/" 2>/dev/null || true

      - uses: actions/configure-pages@v5
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

      - name: Opublikuj stronę
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4
