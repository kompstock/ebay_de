<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KOMPRE · eBay DE CSV</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f6f8}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(720px,100%);background:#fff;border-radius:20px;padding:36px;box-shadow:0 16px 50px #20304a18}
    .brand{font-size:13px;letter-spacing:.18em;font-weight:800;color:#d52b1e}
    h1{font-size:clamp(28px,5vw,44px);margin:12px 0 10px}
    .lead{color:#5c6678;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:28px 0}
    .stat{border:1px solid #e4e8ed;border-radius:12px;padding:16px}.stat span{display:block;color:#697386;font-size:13px}.stat b{display:block;margin-top:6px;font-size:20px}
    .button{display:inline-block;background:#1769e0;color:#fff;text-decoration:none;font-weight:750;padding:14px 20px;border-radius:10px}
    .secondary{display:inline-block;margin-left:12px;color:#1769e0;text-decoration:none}.status{margin-top:22px;color:#697386;font-size:14px}
  </style>
</head>
<body>
<main>
  <div class="brand">KOMPRE · EBAY DE</div>
  <h1>Najnowszy plik CSV</h1>
  <p class="lead">Plik dla laptopów dostępnych w feedzie KOMPRE, przygotowany do importu w eBay Germany.</p>
  <section class="stats">
    <div class="stat"><span>Wygenerowano produktów</span><b id="products">—</b></div>
    <div class="stat"><span>Kurs EUR NBP</span><b id="rate">—</b></div>
    <div class="stat"><span>Data kursu</span><b id="rate-date">—</b></div>
  </section>
  <a class="button" href="downloads/ebay-de-laptops.csv">Pobierz CSV</a>
  <a class="secondary" href="downloads/review.csv">Raport tłumaczeń</a>
  <p class="status" id="generated">Ładowanie informacji o pliku…</p>
</main>
<script>
fetch("downloads/generation-report.json").then(r=>r.json()).then(data=>{
  document.querySelector("#products").textContent=data.products_exported;
  document.querySelector("#rate").textContent=Number(data.nbp.rate).toFixed(4)+" PLN";
  document.querySelector("#rate-date").textContent=data.nbp.effective_date;
  document.querySelector("#generated").textContent="Wygenerowano: "+new Date(data.generated_at_utc).toLocaleString("pl-PL");
}).catch(()=>document.querySelector("#generated").textContent="Brak wygenerowanego pliku. Uruchom workflow w GitHub Actions.");
</script>
</body>
</html>
